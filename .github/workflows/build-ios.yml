name: Build QingJi iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project QingJi.xcodeproj -scheme QingJi -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/QingJiBuild" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/QingJiBuild/Build/Products/Release-iphoneos/QingJi.app" Payload/
          zip -qry QingJi-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: QingJi-unsigned-IPA
          path: QingJi-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
